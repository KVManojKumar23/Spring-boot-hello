<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f6f9;
        }
        .card {
            background: #ffffff;
            padding: 2rem 3rem;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 0.5rem;
        }
        .name {
            color: #007bff;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- th:text renders the 'name' attribute from your Spring Model -->
        <h1>Hello, <span class="name" th:text="${name}">Default Name</span>!</h1>
        <p>Welcome to the Spring Boot &amp; Thymeleaf application.</p>
    </div>

</body>
</html>
